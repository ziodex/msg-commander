# Independent broker for destructive restart qualification; never restart compose.yaml's broker.
name: msg-commander-recovery
services:
  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    ports:
      - '127.0.0.1:15672:5672'
      - '127.0.0.1:15300:5300'
    volumes:
      - ./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Use the previously accepted emulator license configuration}
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run npm run emulator:up first}
      SQL_WAIT_INTERVAL: 30
      EMULATOR_HTTP_PORT: 5300
    depends_on:
      - sql
  sql:
    image: mcr.microsoft.com/mssql/server@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Use the previously accepted emulator license configuration}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Run npm run emulator:up first}
      MSSQL_MEMORY_LIMIT_MB: 2048
